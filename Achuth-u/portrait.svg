<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 357 432" width="357" height="432">
  <defs>
    <style>
      @keyframes revealDown {
        from { height: 0; }
        to   { height: 432px; }
      }
      @keyframes subtleGlow {
        0%, 100% { opacity: .92; }
        50%       { opacity: 1; }
      }
      .ascii {
        font-family: 'Courier New', Consolas, monospace;
        font-size: 8px;
        font-weight: 700;
        fill: #3BA8FF;
        letter-spacing: .6px;
        animation: subtleGlow 3.5s ease-in-out infinite;
      }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation=".6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rev">
      <rect x="0" y="0" width="357" height="0">
        <animate attributeName="height" from="0" to="432"
                 dur="2s" fill="freeze"
                 calcMode="spline" keySplines="0.22 1 0.36 1"/>
      </rect>
    </clipPath>
  </defs>
