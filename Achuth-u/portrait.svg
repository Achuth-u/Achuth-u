<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 321 345" width="321" height="345">
  <defs>
    <style>
      @keyframes drawDown {
        0% {
          height: 0px;
        }
        100% {
          height: 345px;
        }
      }
      @keyframes subtlePulse {
        0%, 100% {
          opacity: 0.95;
        }
        50% {
          opacity: 1;
        }
      }
      .ascii-text {
        font-family: 'Courier New', Consolas, 'Fira Code', monospace;
        font-size: 9px;
        font-weight: 700;
        fill: #3BA8FF;
        letter-spacing: 0.8px;
        dominant-baseline: alphabetic;
        animation: subtlePulse 3s infinite ease-in-out;
      }
      .reveal-rect {
        animation: drawDown 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }
    </style>
    <filter id="cyber-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="portrait-reveal-clip">
      <rect class="reveal-rect" x="0" y="0" width="321" height="0">
        <animate attributeName="height" from="0" to="345" dur="1.8s" fill="freeze" calcMode="spline" keySplines="0.25 1 0.5 1" />
      </rect>
    </clipPath>
  </defs>

  <!-- Animated ASCII Portrait Content -->
  <g clip-path="url(#portrait-reveal-clip)" filter="url(#cyber-glow)">
    <text class="ascii-text" xml:space="preserve">
    <tspan x="10" y="20">                                                          </tspan>
    <tspan x="10" y="30">                                                          </tspan>
    <tspan x="10" y="41">                                                          </tspan>
    <tspan x="10" y="51">                                                          </tspan>
    <tspan x="10" y="62">                                                          </tspan>
    <tspan x="10" y="72">                                                          </tspan>
    <tspan x="10" y="83">                       .:~*xxxx*+;.                       </tspan>
    <tspan x="10" y="93">                    ';xXOOXXXXXXXOXx~'                    </tspan>
    <tspan x="10" y="104">                   ,xOXXXXXXXXXXXXXXOX:                   </tspan>
    <tspan x="10" y="114">                  :OXXXXXXXXXXXXXXXXXXO;                  </tspan>
    <tspan x="10" y="125">                 'XXXXXXXXXXXXXXXXXXXXXO.                 </tspan>
    <tspan x="10" y="135">                 :OXXXXXXXXXXXXXXXXXXXXO~                 </tspan>
    <tspan x="10" y="146">                 :OXXXXXXXXXXXXXXXXXXXXO~                 </tspan>
    <tspan x="10" y="156">                 'XXXXXXXXXXXXXXXXXXXXXO,                 </tspan>
    <tspan x="10" y="167">                  :OXXXXXXXXXXXXXXXXXXO~                  </tspan>
    <tspan x="10" y="177">                   :XOXXXXXXXXXXXXXXOX;                   </tspan>
    <tspan x="10" y="188">                    ';*XXXXXXXXXXXXx~'                    </tspan>
    <tspan x="10" y="198">                   ''.:*XXXXXXXXXX*;.''                   </tspan>
    <tspan x="10" y="209">               .:~*xXOXXXXXXXXXXXXXXOXx*+:.               </tspan>
    <tspan x="10" y="219">            .~xXOOXXXXXXXXXXXXXXXXXXXXXXXOXx~,            </tspan>
    <tspan x="10" y="230">          ,*XOXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXOX*:          </tspan>
    <tspan x="10" y="240">        '+XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXO*.        </tspan>
    <tspan x="10" y="251">       'xOXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX.       </tspan>
    <tspan x="10" y="261">       *OXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXx       </tspan>
    <tspan x="10" y="272">      'XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX,      </tspan>
    <tspan x="10" y="282">      'XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX.      </tspan>
    <tspan x="10" y="293">       ;OXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXO+       </tspan>
    <tspan x="10" y="303">        ~OXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXO+        </tspan>
    <tspan x="10" y="314">         ,xXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXx:         </tspan>
    <tspan x="10" y="324">           :*XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXx;           </tspan>
    </text>
  </g>
</svg>
