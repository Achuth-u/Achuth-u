<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 360" width="490" height="360">
  <defs>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .window-bg {
        fill: #0d1117;
        stroke: #1f6feb;
        stroke-width: 1.5px;
        rx: 10px;
        ry: 10px;
      }

      .header-bg {
        fill: #161b22;
        rx: 10px;
        ry: 10px;
      }

      .window-title {
        font-family: 'Courier New', Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #8b949e;
      }

      .prompt-user { font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; fill: #3BA8FF; }
      .prompt-colon { font-family: 'Courier New', monospace; font-size: 13px; fill: #c9d1d9; }
      .prompt-path { font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; fill: #58A6FF; }
      .prompt-char { font-family: 'Courier New', monospace; font-size: 13px; fill: #c9d1d9; }
      .cmd-text { font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; fill: #ffffff; }

      .label-text {
        font-family: 'Courier New', Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #58A6FF;
        letter-spacing: 0.5px;
      }

      .val-text {
        font-family: 'Courier New', Consolas, monospace;
        font-size: 12px;
        fill: #c9d1d9;
      }

      .val-status {
        font-family: 'Courier New', Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #3fb950;
      }

      .val-link {
        font-family: 'Courier New', Consolas, monospace;
        font-size: 12px;
        fill: #3BA8FF;
        text-decoration: underline;
      }

      .blinking-cursor {
        fill: #3BA8FF;
        animation: blinkCursor 1s infinite steps(2, start);
      }

      .term-line {
        animation: fadeIn 0.4s ease-out forwards;
        opacity: 0;
      }

      .line-0 { animation-delay: 0.1s; }
      .line-1 { animation-delay: 0.25s; }
      .line-2 { animation-delay: 0.4s; }
      .line-3 { animation-delay: 0.55s; }
      .line-4 { animation-delay: 0.7s; }
      .line-5 { animation-delay: 0.85s; }
      .line-6 { animation-delay: 1.0s; }
      .line-7 { animation-delay: 1.15s; }
      .line-8 { animation-delay: 1.3s; }
      .line-9 { animation-delay: 1.45s; }
      .line-10 { animation-delay: 1.6s; }
    </style>

    <filter id="panel-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Window Box -->
  <rect class="window-bg" x="2" y="2" width="486" height="356" filter="url(#panel-shadow)" />

  <!-- Terminal Header Bar -->
  <path class="header-bg" d="M 2,12 A 10,10 0 0 1 12,2 L 478,2 A 10,10 0 0 1 488,12 L 488,32 L 2,32 Z" />
  
  <!-- Window Control Buttons (Red, Yellow, Green) -->
  <circle cx="18" cy="17" r="5" fill="#ff5f56" />
  <circle cx="34" cy="17" r="5" fill="#ffbd2e" />
  <circle cx="50" cy="17" r="5" fill="#27c93f" />

  <!-- Window Header Title -->
  <text x="245" y="21" text-anchor="middle" class="window-title">achuth@cyber-terminal:~</text>

  <!-- Divider Line -->
  <line x1="2" y1="32" x2="488" y2="32" stroke="#1f6feb" stroke-width="1" />

  <!-- Terminal Content Lines -->
    <g class="term-line line-0">
      <text x="20" y="55" class="prompt-user">achuth@cyber-terminal</text><text x="182" y="55" class="prompt-colon">:</text><text x="190" y="55" class="prompt-path">~</text><text x="200" y="55" class="prompt-char">$ </text><text x="215" y="55" class="cmd-text">sysinfo --fetch</text>
    </g>
    <g class="term-line line-1">
      <text x="20" y="88" class="label-text">USER      :</text>
      <text x="125" y="88" class="val-text">Achuth U</text>
    </g>
    <g class="term-line line-2">
      <text x="20" y="114" class="label-text">ROLE      :</text>
      <text x="125" y="114" class="val-text">Software Developer</text>
    </g>
    <g class="term-line line-3">
      <text x="20" y="140" class="label-text">FOCUS     :</text>
      <text x="125" y="140" class="val-text">Python • React • FastAPI • AI</text>
    </g>
    <g class="term-line line-4">
      <text x="20" y="166" class="label-text">LEARNING  :</text>
      <text x="125" y="166" class="val-text">Agentic AI</text>
    </g>
    <g class="term-line line-5">
      <text x="20" y="192" class="label-text">PROJECTS  :</text>
      <text x="125" y="192" class="val-text">BudgetBuddy • Blockchain Voting • 3D Portfolio</text>
    </g>
    <g class="term-line line-6">
      <text x="20" y="218" class="label-text">STATUS    :</text>
      <text x="125" y="218" class="val-status">Open to Work</text>
    </g>
    <g class="term-line line-7">
      <text x="20" y="244" class="label-text">GITHUB    :</text>
      <text x="125" y="244" class="val-link">github.com/Achuth-u</text>
    </g>
    <g class="term-line line-8">
      <text x="20" y="270" class="label-text">PORTFOLIO :</text>
      <text x="125" y="270" class="val-link">3dportfolioachuth.vercel.app</text>
    </g>
    <g class="term-line line-9">
      <text x="20" y="296" class="label-text">LINKEDIN  :</text>
      <text x="125" y="296" class="val-link">linkedin.com/in/achuth-u</text>
    </g>
    <g class="term-line line-10">
      <text x="20" y="327" class="prompt-user">achuth@cyber-terminal</text><text x="182" y="327" class="prompt-colon">:</text><text x="190" y="327" class="prompt-path">~</text><text x="200" y="327" class="prompt-char">$ </text>
      <rect x="215" y="315" width="8" height="14" class="blinking-cursor" />
    </g>
</svg>
