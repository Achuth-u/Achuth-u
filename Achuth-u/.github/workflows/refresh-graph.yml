name: Daily Contribution Graph Refresh

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  refresh-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements-daily.txt

      - name: Pull Contributions & Render Graph
        run: |
          python tools/pull_contributions.py
          python tools/render_graph.py

      - name: Commit and Push Updated Graph
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add graph.svg assets/contributions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "build(cron): refresh contribution graph and json metrics" && git push)
