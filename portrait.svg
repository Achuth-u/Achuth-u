<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 398" width="384" height="398">
  <defs>
    <style>
      @keyframes revealDown {
        from { height: 0; }
        to   { height: 398px; }
      }
      @keyframes cyberPulse {
        0%, 100% { opacity: .88; }
        50%       { opacity: 1.0; }
      }
      .ascii {
        font-family: "Courier New", Consolas, "Fira Code", monospace;
        font-size: 7.5px;
        font-weight: 700;
        fill: #3BA8FF;
        letter-spacing: .5px;
        animation: cyberPulse 4s ease-in-out infinite;
      }
    </style>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation=".5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rev">
      <rect x="0" y="0" width="384" height="0">
        <animate attributeName="height"
                 from="0" to="398"
                 dur="2.2s" fill="freeze"
                 calcMode="spline"
                 keySplines="0.2 1 0.3 1"/>
      </rect>
    </clipPath>
  </defs>
